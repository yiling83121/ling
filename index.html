<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人退休金缺口試算器</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; }
    .highlight { color: #d9534f; font-weight: bold; font-size: 1.2em; }
  </style>
</head>
<body>
  <h2>退休金缺口試算</h2>
  <div class="form-group">
    <label>預計退休年齡</label>
    <input type="number" id="retireAge" value="65">
  </div>
  <div class="form-group">
    <label>預估退休後平均餘命（年）</label>
    <input type="number" id="lifeYears" value="20">
  </div>
  <div class="form-group">
    <label>退休後預估每月生活費（元）</label>
    <input type="number" id="monthlyExpense" value="40000">
  </div>
  <div class="form-group">
    <label>已準備/預估勞保勞退每月領取總額（元）</label>
    <input type="number" id="socialSecurity" value="20000">
  </div>
  <button onclick="calculate()">開始試算缺口</button>

  <div class="result" id="resultBox" style="display:none;">
    <p>退休總需資金：<span id="totalNeeded">0</span> 元</p>
    <p>社會保險預估總領：<span id="totalCovered">0</span> 元</p>
    <hr>
    <p>您的退休金缺口為：<span id="gap" class="highlight">0</span> 元</p>
  </div>

  <script>
    function calculate() {
      const years = parseFloat(document.getElementById('lifeYears').value) || 0;
      const monthlyExp = parseFloat(document.getElementById('monthlyExpense').value) || 0;
      const socialSec = parseFloat(document.getElementById('socialSecurity').value) || 0;

      const totalNeeded = monthlyExp * 12 * years;
      const totalCovered = socialSec * 12 * years;
      const gap = totalNeeded - totalCovered;

      document.getElementById('totalNeeded').innerText = totalNeeded.toLocaleString();
      document.getElementById('totalCovered').innerText = totalCovered.toLocaleString();
      document.getElementById('gap').innerText = (gap > 0 ? gap : 0).toLocaleString();
      document.getElementById('resultBox').style.display = 'block';
    }
  </script>
</body>
</html>
