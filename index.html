<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測測你的理想退休生活！退休金缺口線上試算</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); min-height: 100vh; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; }
    .card { background: #ffffff; max-width: 480px; width: 100%; padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); }
    .badge { background: #e0f2fe; color: #0284c7; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 8px; }
    h1 { margin: 0 0 8px 0; font-size: 1.6rem; color: #1e293b; text-align: center; }
    .subtitle { font-size: 0.95rem; color: #64748b; text-align: center; margin-bottom: 24px; line-height: 1.5; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; color: #0f172a; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #2563eb; }
    .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.9rem; }
    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); margin-top: 10px; transition: transform 0.1s; }
    button:active { transform: scale(0.98); }
    .result-box { margin-top: 25px; padding: 20px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; display: none; }
    .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; color: #475569; }
    .result-divider { border-top: 1px solid #e2e8f0; margin: 12px 0; }
    .gap-title { font-size: 1.05rem; font-weight: bold; color: #1e293b; text-align: center; }
    .gap-amount { font-size: 2rem; font-weight: 800; color: #ef4444; text-align: center; margin: 6px 0 12px 0; }
    .agent-card { margin-top: 25px; padding-top: 20px; border-top: 1px solid #f1f5f9; text-align: center; }
    .agent-title { font-size: 0.85rem; color: #64748b; margin-bottom: 4px; }
    .agent-name { font-size: 1.1rem; font-weight: bold; color: #0f172a; }
    .contact-btn { display: inline-block; margin-top: 10px; padding: 8px 20px; background: #06c755; color: white; text-decoration: none; border-radius: 20px; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>

<div class="card">
  <div style="text-align: center;"><span class="badge">💡 人生下半場自主權</span></div>
  <h1>理想退休金缺口試算</h1>
  <p class="subtitle">告別老後貧窮！只需 10 秒鐘，為未來的自己算算看需要準備多少勇氣與資金。</p>

  <div class="form-group">
    <label>🎯 預計退休年齡</label>
    <div class="input-wrapper">
      <input type="number" id="retireAge" value="65">
      <span class="unit">歲</span>
    </div>
  </div>

  <div class="form-group">
    <label>⌛ 退休後想好好享受幾年？（預估餘命）</label>
    <div class="input-wrapper">
      <input type="number" id="lifeYears" value="25">
      <span class="unit">年</span>
    </div>
  </div>

  <div class="form-group">
    <label>☕ 退休後希望每月有多少生活費？</label>
    <div class="input-wrapper">
      <input type="number" id="monthlyExpense" value="50000">
      <span class="unit">元/月</span>
    </div>
  </div>

  <div class="form-group">
    <label>🛡️ 預估政府勞保/勞退每月領取總額</label>
    <div class="input-wrapper">
      <input type="number" id="socialSecurity" value="25000">
      <span class="unit">元/月</span>
    </div>
  </div>

  <button onclick="calculate()">🚀 一鍵測出我的退休缺口</button>

  <div class="result-box" id="resultBox">
    <div class="result-row">
      <span>理想退休總需資金：</span>
      <strong id="totalNeeded" style="color:#0f172a;">0 元</strong>
    </div>
    <div class="result-row">
      <span>社會保險預估保障：</span>
      <strong id="totalCovered" style="color:#16a34a;">0 元</strong>
    </div>
    <div class="result-divider"></div>
    <div class="gap-title">⚠️ 您的退休資金缺口</div>
    <div class="gap-amount">$<span id="gap">0</span></div>
    <p style="font-size:0.85rem; color:#64748b; text-align:center; margin:0;">提早規劃缺口，讓時間成為你最好的複利工具！</p>
  </div>

  <div class="agent-card">
    <div class="agent-title">專業理財規劃諮詢</div>
    <div class="agent-name">您的專屬保險顧問【請填寫姓名】</div>
    <p style="font-size:0.85rem; color:#64748b; margin:4px 0;">電話：09xx-xxx-xxx</p>
    <a href="https://line.me" target="_blank" class="contact-btn">💬 一鍵加 LINE 聊聊規劃方案</a>
  </div>
</div>

<script>
  function calculate() {
    const years = parseFloat(document.getElementById('lifeYears').value) || 0;
    const monthlyExp = parseFloat(document.getElementById('monthlyExpense').value) || 0;
    const socialSec = parseFloat(document.getElementById('socialSecurity').value) || 0;

    const totalNeeded = monthlyExp * 12 * years;
    const totalCovered = socialSec * 12 * years;
    const gap = totalNeeded - totalCovered;

    document.getElementById('totalNeeded').innerText = totalNeeded.toLocaleString() + ' 元';
    document.getElementById('totalCovered').innerText = totalCovered.toLocaleString() + ' 元';
    document.getElementById('gap').innerText = (gap > 0 ? gap : 0).toLocaleString();
    
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
